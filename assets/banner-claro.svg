<style>
.st{fill:#ffffff;animation:tw ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.w1{animation:mv 14s linear infinite} .w2{animation:mv 22s linear infinite reverse} .w3{animation:mv 30s linear infinite}
@keyframes mv{from{transform:translateX(0)}to{transform:translateX(-400px)}}
.halo{animation:hl 6s ease-in-out infinite;transform-origin:985px 96px}
@keyframes hl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.fug{stroke:#ffffff;stroke-width:1.6;stroke-linecap:round;opacity:0;animation:fg 9s ease-in 3s infinite}
@keyframes fg{0%{opacity:0;transform:translate(0,0)}2%{opacity:1}8%{opacity:0;transform:translate(-260px,90px)}100%{opacity:0;transform:translate(-260px,90px)}}
.t1{animation:up 1.2s ease-out both} .t2{animation:up 1.2s .25s ease-out both} .t3{animation:up 1.2s .5s ease-out both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ref{animation:rf 4s ease-in-out infinite}
@keyframes rf{0%,100%{opacity:.25}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
